<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nononick Invite</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #explode-btn {
            font-size: 26px;
            font-weight: bold;
            padding: 20px 50px;
            background: linear-gradient(45deg, #ff0000, #ff7300);
            border: none;
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 60, 0, 0.8);
            position: relative;
            z-index: 10;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(0.95); box-shadow: 0 0 15px rgba(255, 60, 0, 0.5); }
            to { transform: scale(1); box-shadow: 0 0 40px rgba(255, 60, 0, 1); }
        }
        #welcome-screen {
            display: none;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            animation: fadeIn 1s ease-in-out;
            background: rgba(0,0,0,0.9);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #ff7300;
            box-shadow: 0 0 50px rgba(255, 115, 0, 0.6);
        }
        #profile-pic {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid #ff7300;
            margin-bottom: 20px;
            object-fit: contain;
            background: #111;
            padding: 14px;
            box-shadow: 0 0 25px rgba(255, 115, 0, 0.7);
        }
        h1 { margin: 10px 0; font-size: 28px; color: #fff; }
        .brand { color: #ff7300; font-size: 20px; font-weight: bold; margin-bottom: 30px;}
        .host { font-size: 16px; color: #ccc; margin-top: 20px; }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <button id="explode-btn">ورود به Nononick</button>
    <div id="welcome-screen">
        <!-- لوگو تمیز Nononick -->
        <img id="profile-pic" src="" alt="Nononick Logo">
        <h1 id="guest-name">سلام رفیق!</h1>
        <div class="brand">به Nononick خوش اومدی</div>
        <p style="color: #ddd;">اگه خواستی یه وب‌سایت حرفه‌ای داشته باشی، من اینجام!</p>
        <div class="host">از طرف: علیرضا</div>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('explode-btn');
        const welcome = document.getElementById('welcome-screen');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];
        function getGuestInfo() {
            const guestName = "علی";
            // لوگو تمیز SVG از عکس شما
            const profilePicUrl = "data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20300%20400%22%3E%3Cg%20fill%3D%22%23000%22%3E%3Cpolygon%20points%3D%2230%2C40%20100%2C40%20100%2C280%2030%2C360%22/%3E%3Cpolygon%20points%3D%2280%2C40%20160%2C40%20250%2C280%20180%2C360%20100%2C200%20170%2C120%22/%3E%3Cpolygon%20points%3D%22190%2C40%20270%2C40%20270%2C360%20190%2C280%22/%3E%3C/g%3E%3C/svg%3E";
            return { guestName, profilePicUrl };
        }
        btn.addEventListener('click', () => {
            const { guestName, profilePicUrl } = getGuestInfo();
            if (navigator.vibrate) {
                navigator.vibrate([200, 100, 300]);
            }
            document.body.style.animation = "shake 0.5s";
            btn.style.display = 'none';
            createParticles();
            setTimeout(() => {
                document.getElementById('profile-pic').src = profilePicUrl;
                document.getElementById('guest-name').innerText = "سلام " + guestName + "!";
                welcome.style.display = 'block';
            }, 700);
        });
        function createParticles() {
            for (let i = 0; i < 300; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 25,
                    vy: (Math.random() - 0.5) * 25,
                    size: Math.random() * 12 + 2,
                    color: `hsl(${Math.random() * 60 + 300}, 100%, 50%)`
                });
            }
            animate();
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15;
            }
            requestAnimationFrame(animate);
        }
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                0% { transform: translate(1px, 1px) rotate(0deg); }
                10% { transform: translate(-1px, -2px) rotate(-1deg); }
                20% { transform: translate(-3px, 0px) rotate(1deg); }
                30% { transform: translate(3px, 2px) rotate(0deg); }
                40% { transform: translate(1px, -1px) rotate(1deg); }
                50% { transform: translate(-1px, 2px) rotate(-1deg); }
                60% { transform: translate(-3px, 1px) rotate(0deg); }
                70% { transform: translate(3px, 1px) rotate(-1deg); }
                80% { transform: translate(-1px, -1px) rotate(1deg); }
                90% { transform: translate(1px, 2px) rotate(0deg); }
                100% { transform: translate(1px, -2px) rotate(-1deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
