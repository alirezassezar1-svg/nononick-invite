<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nononick Invite</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* دکمه‌ی اصلی ورود */
        #explode-btn {
            font-size: 26px;
            font-weight: bold;
            padding: 20px 50px;
            background: linear-gradient(45deg, #ff0000, #ff7300);
            border: none;
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 60, 0, 0.8);
            position: relative;
            z-index: 10;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(0.95); box-shadow: 0 0 15px rgba(255, 60, 0, 0.5); }
            to { transform: scale(1); box-shadow: 0 0 40px rgba(255, 60, 0, 1); }
        }

        /* استایل مشترک کارت‌ها (دو کارت) */
        .card {
            display: none;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            background: rgba(0,0,0,0.9);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #ff7300;
            box-shadow: 0 0 50px rgba(255, 115, 0, 0.6);
            width: 80%;
            max-width: 400px;
        }

        /* انیمیشن ظاهر شدن کارت‌ها */
        .show-card {
            display: block !important;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        /* کارت اول */
        #card-one { border-color: #00e5ff; box-shadow: 0 0 50px rgba(0, 229, 255, 0.6); }
        #card-one h1 { font-size: 40px; color: #00e5ff; margin-bottom: 0; text-shadow: 0 0 20px #00e5ff; }

        /* عکس یا آواتار */
        #profile-pic {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #ff7300;
            margin-bottom: 20px;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(255, 115, 0, 0.8);
        }

        h1 { margin: 10px 0; font-size: 28px; color: #fff; }
        .brand { color: #ff7300; font-size: 20px; font-weight: bold; margin-bottom: 30px;}
        p { color: #ddd; line-height: 1.8; font-size: 16px; }
        .host { font-size: 14px; color: #aaa; margin-top: 20px; }

        /* دکمه‌ی تغییر کارت */
        .next-btn {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            background: #ff7300;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .next-btn:hover { background: #ff9500; box-shadow: 0 0 15px #ff7300; }

        /* استایل فالو */
        .follow-text { font-size: 22px; color: #ff7300; font-weight: bold; margin-top: 20px; text-shadow: 0 0 10px #ff7300; }
        .follow-text span { animation: blink 1s infinite alternate; }
        @keyframes blink { from {opacity: 1;} to {opacity: 0.5;} }

        /* ذرات انفجار */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* لرزش صفحه */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <button id="explode-btn">ورود به Nononick</button>

    <!-- کارت اول: سلام -->
    <div id="card-one" class="card">
        <h1>سلام!</h1>
        <p>خوش اومدی رفیق.</p>
        <button class="next-btn" onclick="showCardTwo()">ادامه</button>
    </div>

    <!-- کارت دوم: خوش آمدگویی و فالو -->
    <div id="card-two" class="card">
        <img id="profile-pic" src="" alt="Profile">
        <h1>به Nononick خوش تشریف میاری!</h1>
        <p>اگه خواستی یه وب‌سایت حرفه‌ای داشته باشی، من اینجام!</p>
        
        <div class="follow-text">فالو یادت نره <span>!</span></div>
        
        <div class="host">از طرف: علیرضا</div>
    </div>

        function getGuestInfo() {
            const guestName = "علی"; // اسم دوستت رو اینجا بنویس
            const profilePicUrl = NONONICK_LOGO;
            return { guestName, profilePicUrl };
        }

        btn.addEventListener('click', () => {
            const { guestName, profilePicUrl } = getGuestInfo();

            // لرزش موبایل
            if (navigator.vibrate) {
                navigator.vibrate([200, 100, 300]);
            }

            // لرزش صفحه
            document.body.style.animation = "shake 0.5s";
            
            // مخفی کردن دکمه و اجرای انفجار
            btn.style.display = 'none';
            createParticles();

            // نمایش کارت اول (سلام)
            setTimeout(() => {
                cardOne.classList.add('show-card');
            }, 700);
        });

        // تابع نمایش کارت دوم (وقتی روی "ادامه" کلیک می‌شود)
        function showCardTwo() {
            const { guestName, profilePicUrl } = getGuestInfo();
            
            cardOne.classList.remove('show-card');
            
            // ست کردن عکس و اسم در کارت دوم
            document.getElementById('profile-pic').src = profilePicUrl;
            
            // نمایش کارت دوم با انیمیشن
            cardTwo.classList.add('show-card');
        }

        // ساخت ذرات انفجار (همان کد قبلی)
        function createParticles() {
            for (let i = 0; i < 300; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 25,
                    vy: (Math.random() - 0.5) * 25,
                    size: Math.random() * 12 + 2,
                    color: `hsl(${Math.random() * 60 + 300}, 100%, 50%)`
                });
            }
            animate();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15; // جاذبه
            }
            requestAnimationFrame(animate);
        }
    </script>
